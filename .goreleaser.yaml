version: 2

builds:
  - id: raccoon-lb
    main: ./cmd/raccoon-lb
    binary: raccoon-lb

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

    flags:
      - -trimpath

    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}

    files:
      - README.md
      - LICENSE
      - configs/config.example.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
