server:
  address: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 60s
  idle_timeout: 60s
  shutdown_timeout: 10s

balancer:
  algorithm: round_robin

backends:
  - url: http://localhost:9001
    weight: 3
  - url: http://localhost:9002
    weight: 2
  - url: http://localhost:9003
    weight: 1

health:
  interval: 5s
  timeout: 2s
  path: /health
  fall_threshold: 3
  rise_threshold: 2
